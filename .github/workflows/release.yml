name: Build and publish Firefox release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifest_version="$(node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync("public/manifest.json", "utf8")).version)')"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag version $version does not match manifest version $manifest_version"
            exit 1
          fi
          (cd dist && zip -r ../candifill-firefox.zip .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" candifill-firefox.zip --title "CandiFill ${RELEASE_TAG#v}" --generate-notes --verify-tag
