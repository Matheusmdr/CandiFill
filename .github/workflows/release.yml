name: Build and publish browser release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package Firefox and Chromium extensions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifest_version="$(node -e 'const fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync("public/manifest.json", "utf8")).version)')"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag version $version does not match manifest version $manifest_version"
            exit 1
          fi
          (cd dist && zip -r ../candifill-firefox.zip .)

          # Chromium uses a service worker and ignores Firefox-specific settings.
          mkdir dist-chromium
          cp -a dist/. dist-chromium/
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = 'dist-chromium/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          delete manifest.browser_specific_settings;
          delete manifest.background.scripts;
          manifest.minimum_chrome_version = '102';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          (cd dist-chromium && zip -r ../candifill-chromium.zip .)

      - name: Publish browser packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" candifill-firefox.zip candifill-chromium.zip --clobber
          else
            gh release create "$RELEASE_TAG" candifill-firefox.zip candifill-chromium.zip --title "CandiFill ${RELEASE_TAG#v}" --generate-notes --verify-tag
          fi
